<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rifa Online</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
      animation: fadeIn 1s ease;
    }
    .login-container h1 { margin-bottom: 20px; color: #333; }
    .login-container input {
      width: 100%; padding: 10px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 8px;
    }
    .login-container button {
      width: 100%; padding: 10px; margin-top: 15px;
      background: #74ebd5; border: none; border-radius: 8px;
      color: white; font-weight: bold; cursor: pointer;
    }
    .login-container button:hover { background: #4bb3a7; }
    #mensaje { color: red; margin-top: 10px; }
    #contenido { display: none; width: 90%; margin: auto; text-align: center; }
    #gridBoletos {
      display: grid; grid-template-columns: repeat(25, 1fr);
      gap: 5px; margin-top: 20px;
    }
    .boleto {
      border: 1px solid #ccc; padding: 5px; text-align: center;
      cursor: pointer; border-radius: 4px; background: #f9f9f9;
    }
    .verde { background-color: lightgreen; }
    .azul { background-color: lightblue; }
    .amarillo { background-color: lightyellow; }
    .gris { background-color: lightgray; }
    .pink { background-color: pink; }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="loginForm" class="login-container">
    <h1>Rifa Online</h1>
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="clave" placeholder="Clave">
    <button id="ingresar">Ingresar</button>
    <p id="mensaje"></p>
  </div>

  <!-- Contenido principal -->
  <div id="contenido">
    <div style="margin-bottom:10px;">
      <button id="guardar">Guardar</button>
      <button id="exportar">Exportar CSV</button>
      <button id="logout">Cerrar sesión</button>
    </div>
    <div id="gridBoletos"></div>
  </div>

  <!-- Socket.IO desde tu servidor Render -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(); // se conecta al mismo host Render
    const colores = { "JPACHAS": "verde", "KPACHAS": "azul", "CPACHAS": "amarillo", "NBRAVO": "gris", "JTERR": "pink" };
    let usuarioActivo = null;

    document.getElementById("ingresar").addEventListener("click", () => {
      const user = document.getElementById("usuario").value.trim();
      const pass = document.getElementById("clave").value.trim();
      socket.emit("login", { usuario: user, clave: pass });
    });

    socket.on("login_ok", (data) => {
      usuarioActivo = data.usuario;
      localStorage.setItem("usuarioActivo", usuarioActivo);
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("contenido").style.display = "block";
      crearGrid();
    });

    socket.on("login_error", (msg) => {
      document.getElementById("mensaje").textContent = msg;
    });

    function crearGrid() {
      const grid = document.getElementById("gridBoletos");
      grid.innerHTML = "";
      for (let i = 1; i <= 250; i++) {
        const div = document.createElement("div");
        div.textContent = i;
        div.classList.add("boleto");
        div.dataset.numero = i;
        div.addEventListener("click", () => seleccionar(div));
        grid.appendChild(div);
      }
    }

   socket.on("estado", (boletos) => {
  document.querySelectorAll(".boleto").forEach(div => {
    const numero = div.dataset.numero;
    div.className = "boleto";
    div.textContent = numero; // solo número, sin input
    if (boletos[numero]) {
      const { usuario } = boletos[numero];
      div.classList.add(colores[usuario]); // solo color
    }
  });
});


    function seleccionar(div) {
      const numero = div.dataset.numero;
      if (!usuarioActivo) return;
      const nombre = prompt("Ingrese nombre para el boleto " + numero);
      if (nombre) {
        socket.emit("seleccionar", { numero, nombre, usuario: usuarioActivo });
      }
    }

    socket.on("seleccion_error", (msg) => {
      alert(msg);
    });

    document.getElementById("guardar").addEventListener("click", () => {
      socket.emit("estado_request");
      alert("Cambios guardados y sincronizados.");
    });

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("usuarioActivo");
      usuarioActivo = null;
      document.getElementById("contenido").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    });
  </script>
</body>
</html>
